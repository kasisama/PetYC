<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ 宠物养成系统 - 终极控制中心</title>
    <!-- 所有后台资源均随二进制嵌入，支持离线运行。 -->
    <link rel="stylesheet" href="vendor/fontawesome.min.css">
    <!-- Tailwind CSS Play CDN -->
    <script src="vendor/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                            950: '#0f0724',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Vue 3 UMD -->
    <script src="vendor/vue.global.prod.js"></script>
    <!-- Chart.js -->
    <script src="vendor/chart.umd.min.js"></script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-slate-900/40 backdrop-blur-xl border border-white/5 shadow-2xl shadow-black/50;
            }
            .glass-card {
                @apply bg-white/[0.02] backdrop-blur-md border border-white/10 rounded-2xl hover:border-brand-500/30 transition-all duration-300 shadow-lg shadow-black/20;
            }
            .glass-input {
                @apply bg-black/20 border border-white/10 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-brand-500/50 focus:ring-2 focus:ring-brand-500/20 transition-all placeholder-slate-500;
            }
            .glass-btn {
                @apply relative overflow-hidden transition-all duration-300 font-medium active:scale-95 disabled:opacity-30 disabled:pointer-events-none;
            }
            .glass-btn-primary {
                @apply glass-btn bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white rounded-xl shadow-lg shadow-brand-500/20;
            }
            .glass-btn-secondary {
                @apply glass-btn bg-white/5 border border-white/10 hover:bg-white/10 text-slate-200 rounded-xl;
            }
            .glass-btn-danger {
                @apply glass-btn bg-rose-600/80 hover:bg-rose-500 text-white rounded-xl;
            }
            .glass-btn-success {
                @apply glass-btn bg-emerald-600/80 hover:bg-emerald-500 text-white rounded-xl;
            }
            .text-glow {
                text-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
            }
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            ::-webkit-scrollbar-track {
                @apply bg-transparent;
            }
            ::-webkit-scrollbar-thumb {
                @apply bg-white/10 rounded-full hover:bg-white/20 transition-all;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-brand-950 text-slate-100 min-h-screen">
    <div id="app" class="flex flex-col min-h-screen">

        <!-- AUTH BOOTSTRAP -->
        <div v-if="!auth.ready" class="flex min-h-screen items-center justify-center">
            <div class="text-center">
                <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl border border-brand-400/20 bg-brand-500/10">
                    <i class="fa-solid fa-shield-cat animate-pulse text-3xl text-brand-300"></i>
                </div>
                <p class="text-sm tracking-wide text-slate-400">正在确认管理员登录状态...</p>
            </div>
        </div>

        <!-- ACCOUNT LOGIN -->
        <main v-else-if="!auth.authenticated" class="relative flex min-h-screen items-center justify-center overflow-hidden p-6">
            <div class="pointer-events-none absolute inset-0">
                <div class="absolute left-[12%] top-[14%] h-72 w-72 rounded-full bg-brand-600/10 blur-3xl"></div>
                <div class="absolute bottom-[10%] right-[10%] h-80 w-80 rounded-full bg-indigo-500/10 blur-3xl"></div>
            </div>
            <section class="glass-panel relative z-10 w-full max-w-md overflow-hidden rounded-3xl border border-white/10">
                <div class="border-b border-white/5 px-8 pb-6 pt-8">
                    <div class="mb-6 flex items-center gap-4">
                        <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-brand-500 to-indigo-600 shadow-lg shadow-brand-500/20">
                            <i class="fa-solid fa-cat text-2xl text-white"></i>
                        </div>
                        <div>
                            <div class="text-xs font-bold uppercase tracking-[0.24em] text-brand-300">QQPET Admin</div>
                            <h1 class="mt-1 text-2xl font-bold text-white">管理员登录</h1>
                        </div>
                    </div>
                    <p class="text-sm leading-6 text-slate-400">登录后可管理宠物数据、群组开关与系统配置。</p>
                </div>

                <form @submit.prevent="login" class="space-y-5 px-8 py-7">
                    <div>
                        <label for="admin-username" class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">管理员账号</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-sm text-slate-500"></i>
                            <input id="admin-username" v-model.trim="loginForm.username" type="text" autocomplete="username" required
                                   class="glass-input w-full py-3 pl-11 pr-4" placeholder="请输入账号">
                        </div>
                    </div>
                    <div>
                        <label for="admin-password" class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">密码</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-sm text-slate-500"></i>
                            <input id="admin-password" v-model="loginForm.password" type="password" autocomplete="current-password" required
                                   class="glass-input w-full py-3 pl-11 pr-4" placeholder="请输入密码">
                        </div>
                    </div>
                    <label class="flex cursor-pointer items-center gap-3 text-sm text-slate-300">
                        <input v-model="loginForm.remember" type="checkbox"
                               class="h-4 w-4 rounded border-white/20 bg-black/20 text-brand-500 focus:ring-brand-500/30">
                        <span>记住我</span>
                        <span class="ml-auto text-xs text-slate-500">保持登录 15 天</span>
                    </label>

                    <div v-if="auth.loginError" class="rounded-xl border border-rose-500/20 bg-rose-500/10 px-4 py-3 text-sm text-rose-200">
                        <i class="fa-solid fa-circle-exclamation mr-2"></i>{{ auth.loginError }}
                    </div>
                    <div v-if="auth.loginNotice" class="rounded-xl border border-emerald-500/20 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-200">
                        <i class="fa-solid fa-circle-check mr-2"></i>{{ auth.loginNotice }}
                    </div>

                    <button type="submit" :disabled="auth.submitting" class="glass-btn-primary flex w-full items-center justify-center gap-2 py-3.5">
                        <i :class="auth.submitting ? 'fa-solid fa-circle-notch animate-spin' : 'fa-solid fa-right-to-bracket'"></i>
                        <span>{{ auth.submitting ? '正在登录...' : '登录控制台' }}</span>
                    </button>
                </form>
            </section>
        </main>

        <template v-else>
        <!-- Top Navbar -->
        <header class="glass-panel sticky top-0 z-40 border-b border-white/5 py-4 px-6 md:px-8 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-500 flex items-center justify-center shadow-lg shadow-brand-500/30 animate-pulse">
                    <i class="fa-solid fa-cat text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-glow bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">QQPET <span class="text-brand-400 font-extrabold text-sm tracking-widest px-2 py-0.5 rounded-md bg-brand-500/10 border border-brand-500/20 ml-1">ADMIN</span></h1>
                    <p class="text-xs text-slate-400">群友回忆情怀 - 终极可视化控制台</p>
                </div>
            </div>
            
            <!-- Navigation -->
            <nav class="hidden md:flex items-center gap-2">
                <button @click="activeTab = 'dashboard'" :class="activeTab === 'dashboard' ? 'bg-brand-500/20 text-brand-300 border-brand-500/40' : 'text-slate-400 hover:text-slate-200 border-transparent'" class="px-4 py-2 rounded-xl text-sm font-medium border transition-all flex items-center gap-2">
                    <i class="fa-solid fa-chart-line"></i>大盘总览
                </button>
                <button @click="activeTab = 'pets'" :class="activeTab === 'pets' ? 'bg-brand-500/20 text-brand-300 border-brand-500/40' : 'text-slate-400 hover:text-slate-200 border-transparent'" class="px-4 py-2 rounded-xl text-sm font-medium border transition-all flex items-center gap-2">
                    <i class="fa-solid fa-paw"></i>宠物管理
                </button>
                <button @click="activeTab = 'groups'" :class="activeTab === 'groups' ? 'bg-brand-500/20 text-brand-300 border-brand-500/40' : 'text-slate-400 hover:text-slate-200 border-transparent'" class="px-4 py-2 rounded-xl text-sm font-medium border transition-all flex items-center gap-2">
                    <i class="fa-solid fa-tower-broadcast"></i>群控开关 & 补偿发放
                </button>
                <button @click="activeTab = 'configs'" :class="activeTab === 'configs' ? 'bg-brand-500/20 text-brand-300 border-brand-500/40' : 'text-slate-400 hover:text-slate-200 border-transparent'" class="px-4 py-2 rounded-xl text-sm font-medium border transition-all flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i>配置设置
                </button>
            </nav>
            
            <!-- System Quick Controls -->
            <div class="flex items-center gap-3">
                <div class="hidden lg:flex items-center gap-2 border-r border-white/10 pr-3 text-xs text-slate-400">
                    <i class="fa-solid fa-circle-user text-brand-300"></i>
                    <span>{{ auth.username }}</span>
                </div>
                <button @click="openChangePassword" title="修改管理员密码" class="glass-btn-secondary px-3 py-2 rounded-lg text-sm flex items-center gap-2">
                    <i class="fa-solid fa-key"></i><span class="hidden xl:inline">修改密码</span>
                </button>
                <button @click="logout" title="退出管理员登录" class="glass-btn-secondary px-3 py-2 rounded-lg text-sm flex items-center gap-2 hover:border-rose-500/30 hover:text-rose-300">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i><span class="hidden xl:inline">退出登录</span>
                </button>
                <button @click="reloadConfigs" title="热重载配置到内存" class="glass-btn-secondary px-3 py-2 rounded-lg text-sm flex items-center gap-2 hover:border-emerald-500/30 hover:text-emerald-400">
                    <i class="fa-solid fa-rotate animate-spin-slow"></i><span class="hidden sm:inline">热重载</span>
                </button>
                <button @click="confirmReset" title="配置恢复默认出厂种子数据" class="glass-btn-danger px-3 py-2 rounded-lg text-sm flex items-center gap-2">
                    <i class="fa-solid fa-trash-arrow-up"></i><span class="hidden sm:inline">出厂重置</span>
                </button>
            </div>
        </header>

        <!-- Mobile Nav Bar -->
        <div class="md:hidden glass-panel py-2 px-4 flex justify-around border-b border-white/5 text-xs">
            <button @click="activeTab = 'dashboard'" :class="activeTab === 'dashboard' ? 'text-brand-400' : 'text-slate-400'" class="flex flex-col items-center gap-1">
                <i class="fa-solid fa-chart-line text-lg"></i>
                <span>总览</span>
            </button>
            <button @click="activeTab = 'pets'" :class="activeTab === 'pets' ? 'text-brand-400' : 'text-slate-400'" class="flex flex-col items-center gap-1">
                <i class="fa-solid fa-paw text-lg"></i>
                <span>宠物</span>
            </button>
            <button @click="activeTab = 'groups'" :class="activeTab === 'groups' ? 'text-brand-400' : 'text-slate-400'" class="flex flex-col items-center gap-1">
                <i class="fa-solid fa-tower-broadcast text-lg"></i>
                <span>群控</span>
            </button>
            <button @click="activeTab = 'configs'" :class="activeTab === 'configs' ? 'text-brand-400' : 'text-slate-400'" class="flex flex-col items-center gap-1">
                <i class="fa-solid fa-sliders text-lg"></i>
                <span>配置</span>
            </button>
        </div>

        <!-- Main Workspace Area -->
        <main class="flex-grow p-6 md:p-8 max-w-7xl w-full mx-auto">
            
            <!-- Global Notification Toast -->
            <transition name="fade">
                <div v-if="toast.show" :class="toast.bg" class="fixed top-20 right-6 z-50 px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 border transition-all duration-300 transform scale-100">
                    <i :class="toast.icon"></i>
                    <span class="text-sm font-medium">{{ toast.message }}</span>
                </div>
            </transition>

            <!-- Loading Mask -->
            <div v-if="loading" class="flex flex-col items-center justify-center py-20">
                <i class="fa-solid fa-circle-notch animate-spin text-brand-500 text-5xl mb-4"></i>
                <p class="text-slate-400 text-sm">正在加载实时数据，请稍候...</p>
            </div>

            <!-- TABS -->
            <div v-show="!loading">
                
                <!-- TAB 1: DASHBOARD -->
                <div v-if="activeTab === 'dashboard'" class="space-y-6">
                    <!-- Stats Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="glass-card p-6 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold tracking-wider text-slate-400 uppercase">总宠物数</p>
                                <h3 class="text-3xl font-extrabold text-white mt-1">{{ stats.total_pets }}</h3>
                            </div>
                            <div class="h-12 w-12 rounded-xl bg-violet-500/10 flex items-center justify-center border border-violet-500/20 text-violet-400">
                                <i class="fa-solid fa-shield-cat text-2xl"></i>
                            </div>
                        </div>
                        <div class="glass-card p-6 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold tracking-wider text-slate-400 uppercase">活跃玩家数</p>
                                <h3 class="text-3xl font-extrabold text-white mt-1">{{ stats.total_users }}</h3>
                            </div>
                            <div class="h-12 w-12 rounded-xl bg-blue-500/10 flex items-center justify-center border border-blue-500/20 text-blue-400">
                                <i class="fa-solid fa-users text-2xl"></i>
                            </div>
                        </div>
                        <div class="glass-card p-6 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold tracking-wider text-slate-400 uppercase">挂机打工中</p>
                                <h3 class="text-3xl font-extrabold text-white mt-1">{{ stats.status_dist['打工'] || 0 }}</h3>
                            </div>
                            <div class="h-12 w-12 rounded-xl bg-amber-500/10 flex items-center justify-center border border-amber-500/20 text-amber-400">
                                <i class="fa-solid fa-hammer text-2xl"></i>
                            </div>
                        </div>
                        <div class="glass-card p-6 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold tracking-wider text-slate-400 uppercase">濒死抢救中</p>
                                <h3 class="text-3xl font-extrabold text-rose-400 mt-1">{{ stats.status_dist['濒死'] || 0 }}</h3>
                            </div>
                            <div class="h-12 w-12 rounded-xl bg-rose-500/10 flex items-center justify-center border border-rose-500/20 text-rose-400 animate-pulse">
                                <i class="fa-solid fa-heart-pulse text-2xl"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Charts Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Doughnut Chart: Status -->
                        <div class="glass-card p-6 md:col-span-1 flex flex-col h-[380px]">
                            <h4 class="text-sm font-semibold tracking-wide text-slate-300 mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-chart-pie text-brand-400"></i>宠物状态分布
                            </h4>
                            <div class="flex-grow flex items-center justify-center relative">
                                <canvas id="chart-status" class="max-h-[250px]"></canvas>
                            </div>
                        </div>
                        
                        <!-- Bar Chart: Wealth Top 10 -->
                        <div class="glass-card p-6 md:col-span-1 flex flex-col h-[380px]">
                            <h4 class="text-sm font-semibold tracking-wide text-slate-300 mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-coins text-amber-400"></i>财富神仙榜 (咔币)
                            </h4>
                            <div class="flex-grow relative">
                                <canvas id="chart-wealth" class="h-full"></canvas>
                            </div>
                        </div>

                        <!-- Bar Chart: Growth Top 10 -->
                        <div class="glass-card p-6 md:col-span-1 flex flex-col h-[380px]">
                            <h4 class="text-sm font-semibold tracking-wide text-slate-300 mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-arrow-up-right-dots text-emerald-400"></i>成长修为榜
                            </h4>
                            <div class="flex-grow relative">
                                <canvas id="chart-growth" class="h-full"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: PET MANAGEMENT -->
                <div v-if="activeTab === 'pets'" class="space-y-6">
                    <!-- Filters Panel -->
                    <div class="glass-panel p-5 rounded-2xl flex flex-wrap gap-4 items-end">
                        <div class="flex-grow min-w-[150px]">
                            <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase">玩家 QQ</label>
                            <input type="text" v-model="petsFilter.user_id" placeholder="搜索 QQ..." class="glass-input w-full text-sm">
                        </div>
                        <div class="flex-grow min-w-[150px]">
                            <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase">QQ 群号</label>
                            <input type="text" v-model="petsFilter.group_id" placeholder="搜索群号..." class="glass-input w-full text-sm">
                        </div>
                        <div class="flex-grow min-w-[150px]">
                            <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase">宠物昵称</label>
                            <input type="text" v-model="petsFilter.name" placeholder="模糊搜索昵称..." class="glass-input w-full text-sm">
                        </div>
                        <div class="min-w-[120px]">
                            <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase">当前状态</label>
                            <select v-model="petsFilter.status" class="glass-input w-full text-sm">
                                <option value="">全部状态</option>
                                <option value="空闲">空闲</option>
                                <option value="打工">打工</option>
                                <option value="学习">学习</option>
                                <option value="锻炼">锻炼</option>
                                <option value="健身">健身</option>
                                <option value="濒死">濒死</option>
                                <option value="逃跑">逃跑</option>
                                <option value="失去宠物">失去宠物</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button @click="fetchPets" class="glass-btn-primary px-6 py-2 rounded-xl text-sm flex items-center gap-2">
                                <i class="fa-solid fa-magnifying-glass"></i>筛选
                            </button>
                            <button @click="clearPetsFilter" class="glass-btn-secondary px-4 py-2 rounded-xl text-sm">
                                重置
                            </button>
                        </div>
                    </div>

                    <!-- Pets Table -->
                    <div class="glass-panel rounded-2xl overflow-hidden shadow-xl">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-white/5 text-slate-400 text-xs font-semibold uppercase tracking-wider bg-white/[0.01]">
                                        <th class="py-4 px-6">ID / 玩家 / 群</th>
                                        <th class="py-4 px-6">宠物种类 & 昵称</th>
                                        <th class="py-4 px-6">基本属性 (血/饱/金)</th>
                                        <th class="py-4 px-6">修为 (成长/好感/智/力/防)</th>
                                        <th class="py-4 px-6 text-center">当前状态</th>
                                        <th class="py-4 px-6 text-right">管理操作</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-white/5 text-sm text-slate-200">
                                    <tr v-for="pet in pets.data" :key="pet.ID" class="hover:bg-white/[0.02] transition-colors">
                                        <td class="py-4 px-6">
                                            <div class="font-semibold text-slate-100">#{{ pet.ID }}</div>
                                            <div class="text-xs text-slate-400 mt-1 flex flex-col">
                                                <span>QQ: {{ pet.UserID }}</span>
                                                <span>群: {{ pet.GroupID }}</span>
                                            </div>
                                        </td>
                                        <td class="py-4 px-6">
                                            <div class="flex items-center gap-3">
                                                <div v-if="pet.Image" class="h-10 w-10 rounded-lg bg-slate-800 border border-white/10 flex items-center justify-center overflow-hidden flex-shrink-0" :key="pet.Image">
                                                    <img :src="getPetImageURL(pet.Image)" class="h-full w-full object-cover" @error="handleImageError">
                                                </div>
                                                <div>
                                                    <div class="font-bold text-white">{{ pet.Name }}</div>
                                                    <div class="text-xs text-brand-400 mt-1 font-medium bg-brand-500/10 px-1.5 py-0.5 rounded border border-brand-500/20 inline-block">{{ pet.PetType }}</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="py-4 px-6">
                                            <div class="space-y-1 text-xs">
                                                <div class="flex justify-between w-28">
                                                    <span class="text-slate-400">生命:</span>
                                                    <span class="font-semibold text-rose-400">{{ pet.Health }} HP</span>
                                                </div>
                                                <div class="flex justify-between w-28">
                                                    <span class="text-slate-400">饱食:</span>
                                                    <span class="font-semibold text-amber-400">{{ pet.Hunger }}%</span>
                                                </div>
                                                <div class="flex justify-between w-28">
                                                    <span class="text-slate-400">货币:</span>
                                                    <span class="font-semibold text-emerald-400">{{ pet.Currency }}</span>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="py-4 px-6">
                                            <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs max-w-[180px]">
                                                <div><span class="text-slate-400">成长:</span> <span class="font-medium text-indigo-400">{{ pet.Growth }}</span></div>
                                                <div><span class="text-slate-400">好感:</span> <span class="font-medium text-pink-400">{{ pet.Affection }}</span></div>

                            取消
                        </button>
                        <button @click="savePetUpdate" class="glass-btn-primary px-8 py-2.5 rounded-xl">
                            保存变更
                        </button>
                    </div>
                </div>
            </div>
        </transition>

        <!-- ADD CONFIG ITEM MODAL -->
        <transition name="modal-slide">
            <div v-if="addConfigModal.show" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
                <div class="glass-panel w-full max-w-md rounded-3xl overflow-hidden shadow-2xl border border-white/10 flex flex-col">
                    <div class="px-6 py-4 bg-white/[0.02] border-b border-white/5 flex items-center justify-between">
                        <h3 class="font-bold text-white text-base">新增配置项</h3>
                        <button @click="addConfigModal.show = false" class="text-slate-400 hover:text-white transition-colors">
                            <i class="fa-solid fa-xmark text-xl"></i>
                        </button>
                    </div>
                    <div class="p-6 space-y-4 text-xs">
                        <div class="space-y-1">
                            <label class="block text-slate-400 font-bold uppercase">唯一标识键名 (如物品名、打工名)</label>
                            <input type="text" v-model="addConfigModal.key" class="glass-input w-full" placeholder="英文或中文键名">
                        </div>
                    </div>
                    <div class="px-6 py-4 bg-white/[0.02] border-t border-white/5 flex items-center justify-end gap-3">
                        <button @click="addConfigModal.show = false" class="glass-btn-secondary px-5 py-2.5 rounded-xl">
                            取消
                        </button>
                        <button @click="submitAddConfigItem" class="glass-btn-primary px-8 py-2.5 rounded-xl">
                            确定添加
                        </button>
                    </div>
                </div>
            </div>
        </transition>

        <!-- CHANGE PASSWORD MODAL -->
        <transition name="modal-slide">
            <div v-if="changePasswordModal.show" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm">
                <form @submit.prevent="changePassword" class="glass-panel w-full max-w-md overflow-hidden rounded-3xl border border-white/10 shadow-2xl">
                    <div class="flex items-center justify-between border-b border-white/5 bg-white/[0.02] px-6 py-5">
                        <div class="flex items-center gap-3">
                            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-500/10 text-brand-300">
                                <i class="fa-solid fa-key"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-white">修改密码</h3>
                                <p class="mt-0.5 text-xs text-slate-500">成功后所有设备都需要重新登录</p>
                            </div>
                        </div>
                        <button type="button" @click="changePasswordModal.show = false" class="text-slate-400 transition-colors hover:text-white">
                            <i class="fa-solid fa-xmark text-xl"></i>
                        </button>
                    </div>
                    <div class="space-y-4 p-6">
                        <div>
                            <label for="current-password" class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">当前密码</label>
                            <input id="current-password" v-model="changePasswordModal.currentPassword" type="password" autocomplete="current-password" required class="glass-input w-full" placeholder="请输入当前密码">
                        </div>
                        <div>
                            <label for="new-password" class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">新密码</label>
                            <input id="new-password" v-model="changePasswordModal.newPassword" type="password" autocomplete="new-password" minlength="6" required class="glass-input w-full" placeholder="至少 6 个字符">
                        </div>
                        <div>
                            <label for="confirm-password" class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">确认新密码</label>
                            <input id="confirm-password" v-model="changePasswordModal.confirmPassword" type="password" autocomplete="new-password" minlength="6" required class="glass-input w-full" placeholder="再次输入新密码">
                        </div>
                        <div v-if="changePasswordModal.error" class="rounded-xl border border-rose-500/20 bg-rose-500/10 px-4 py-3 text-sm text-rose-200">
                            <i class="fa-solid fa-circle-exclamation mr-2"></i>{{ changePasswordModal.error }}
                        </div>
                    </div>
                    <div class="flex items-center justify-end gap-3 border-t border-white/5 bg-white/[0.02] px-6 py-4">
                        <button type="button" @click="changePasswordModal.show = false" class="glass-btn-secondary px-5 py-2.5">取消</button>
                        <button type="submit" :disabled="changePasswordModal.submitting" class="glass-btn-primary flex items-center gap-2 px-6 py-2.5">
                            <i v-if="changePasswordModal.submitting" class="fa-solid fa-circle-notch animate-spin"></i>
                            <span>{{ changePasswordModal.submitting ? '正在保存...' : '确认修改' }}</span>
                        </button>
                    </div>
                </form>
            </div>
        </transition>

        <!-- IMAGE LIGHTBOX MODAL -->
        <transition name="fade">
            <div v-if="lightbox.show" @click="lightbox.show = false" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md cursor-zoom-out">
                <img :src="lightbox.url" class="max-w-full max-h-[90vh] rounded-2xl shadow-2xl border border-white/10 object-contain">
                <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-black/60 px-4 py-2 rounded-full text-xs text-slate-400">点击任意位置关闭预览</div>
            </div>
        </transition>

        </template>
    </div>

    <!-- Script Section -->
    <script>
        const nativeFetch = window.fetch.bind(window);
        let handleAdminUnauthorized = () => {};

        // 管理接口统一使用 HttpOnly Cookie；任意受保护接口返回 401 时回到登录页。
        window.fetch = async (input, init = {}) => {
            const url = typeof input === 'string' ? input : input.url;
            if (!url.startsWith('/api/admin')) return nativeFetch(input, init);

            const response = await nativeFetch(input, {
                ...init,
                credentials: 'same-origin'
            });
            if (response.status === 401 && url !== '/api/admin/auth/login') {
                handleAdminUnauthorized();
            }
            return response;
        };

        const { createApp, ref, reactive, onMounted, computed, watch, nextTick } = Vue;

        createApp({
            setup() {
                const activeTab = ref('dashboard');
                const loading = ref(false);

                const auth = reactive({
                    ready: false,
                    authenticated: false,
                    username: '',
                    submitting: false,
                    loginError: '',
                    loginNotice: ''
                });

                const loginForm = reactive({
                    username: 'admin',
                    password: '',
                    remember: false
                });

                const changePasswordModal = reactive({
                    show: false,
                    currentPassword: '',
                    newPassword: '',
                    confirmPassword: '',
                    submitting: false,
                    error: ''
                });

                const setUnauthenticated = (message = '') => {
                    auth.authenticated = false;
                    auth.ready = true;
                    auth.username = '';
                    auth.submitting = false;
                    auth.loginError = message;
                    loginForm.password = '';
                    loginForm.remember = false;
                    changePasswordModal.show = false;
                    changePasswordModal.currentPassword = '';
                    changePasswordModal.newPassword = '';
                    changePasswordModal.confirmPassword = '';
                    changePasswordModal.submitting = false;
                    changePasswordModal.error = '';
                };

                handleAdminUnauthorized = () => {
                    setUnauthenticated('登录已失效，请重新登录');
                };

                const login = async () => {
                    auth.submitting = true;
                    auth.loginError = '';
                    auth.loginNotice = '';
                    try {
                        const response = await fetch('/api/admin/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(loginForm)
                        });
                        const data = await response.json().catch(() => ({}));
                        if (!response.ok) {
                            auth.loginError = data.error || '登录失败，请重试';
                            loginForm.password = '';
                            return;
                        }
                        auth.authenticated = true;
                        auth.username = data.username || loginForm.username;
                        await loadAdminData();
                    } catch (error) {
                        auth.loginError = '无法连接服务器，请稍后重试';
                    } finally {
                        auth.submitting = false;
                    }
                };

                const checkAdminSession = async () => {
                    try {
                        const response = await fetch('/api/admin/auth/session');
                        const data = await response.json().catch(() => ({}));
                        if (!response.ok) {
                            throw new Error(data.error || '会话检查失败');
                        }
                        auth.authenticated = Boolean(data.authenticated);
                        auth.username = data.username || '';
                        if (auth.authenticated) {
                            await loadAdminData();
                        }
                    } catch (error) {
                        auth.loginError = '无法确认登录状态，请重新登录';
                        auth.authenticated = false;
                    } finally {
                        auth.ready = true;
                    }
                };

                const logout = async () => {
                    try {
                        const response = await fetch('/api/admin/auth/logout', { method: 'POST' });
                        if (!response.ok) {
                            throw new Error('logout failed');
                        }
                        setUnauthenticated();
                        auth.loginNotice = '已安全退出登录';
                    } catch (error) {
                        if (auth.authenticated) {
                            showToast('退出登录失败，请稍后重试', 'error');
                        }
                    }
                };

                const openChangePassword = () => {
                    changePasswordModal.currentPassword = '';
                    changePasswordModal.newPassword = '';
                    changePasswordModal.confirmPassword = '';
                    changePasswordModal.error = '';
                    changePasswordModal.show = true;
                };

                const changePassword = async () => {
                    changePasswordModal.error = '';
                    if (changePasswordModal.newPassword.length < 6) {
                        changePasswordModal.error = '新密码至少需要 6 个字符';
                        return;
                    }
                    if (changePasswordModal.newPassword !== changePasswordModal.confirmPassword) {
                        changePasswordModal.error = '两次输入的新密码不一致';
                        return;
                    }

                    changePasswordModal.submitting = true;
                    try {
                        const response = await fetch('/api/admin/auth/password', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                current_password: changePasswordModal.currentPassword,
                                new_password: changePasswordModal.newPassword,
                                confirm_password: changePasswordModal.confirmPassword
                            })
                        });
                        const data = await response.json().catch(() => ({}));
                        if (!response.ok) {
                            changePasswordModal.error = data.error || '修改密码失败';
                            return;
                        }
                        setUnauthenticated();
                        auth.loginNotice = data.message || '密码修改成功，请重新登录';
                    } catch (error) {
                        changePasswordModal.error = '无法连接服务器，请稍后重试';
                    } finally {
                        changePasswordModal.submitting = false;
                    }
                };

                // Global Toast Notification
                const toast = reactive({
                    show: false,
                    message: '',
                    bg: 'bg-emerald-600/90 border-emerald-500/30 text-white',
                    icon: 'fa-solid fa-circle-check text-emerald-400'
                });

                const showToast = (msg, type = 'success') => {
                    toast.message = msg;
                    if (type === 'success') {
                        toast.bg = 'bg-emerald-950/90 border-emerald-500/30 text-emerald-200';
                        toast.icon = 'fa-solid fa-circle-check text-emerald-400';
                    } else if (type === 'error') {
                        toast.bg = 'bg-rose-950/90 border-rose-500/30 text-rose-200';
                        toast.icon = 'fa-solid fa-triangle-exclamation text-rose-400';
                    } else {
                        toast.bg = 'bg-slate-900/90 border-brand-500/30 text-brand-300';
                        toast.icon = 'fa-solid fa-circle-info text-brand-400';
                    }
                    toast.show = true;
                    setTimeout(() => {
                        toast.show = false;
                    }, 4000);
                };

                // 1. Dashboard Stats
                const stats = reactive({
                    total_pets: 0,
                    total_users: 0,
                    status_dist: {},
                    top_wealth: [],
                    top_growth: [],
                    top_affection: []
                });

                let statusChart = null;
                let wealthChart = null;
                let growthChart = null;

                const fetchStats = async () => {
                    try {
                        const res = await fetch('/api/admin/stats');
                        const data = await res.json();
                        Object.assign(stats, data);
                        renderCharts(data);
                    } catch (e) {
                        showToast('获取统计数据失败: ' + e.message, 'error');
                    }
                };

                const renderCharts = (data) => {
                    const ctxStatus = document.getElementById('chart-status');
                    if (ctxStatus) {
                        if (statusChart) statusChart.destroy();
                        const labels = Object.keys(data.status_dist);
                        const counts = Object.values(data.status_dist);
                        
                        statusChart = new Chart(ctxStatus, {
                            type: 'doughnut',
                            data: {
                                labels: labels,
                                datasets: [{
                                    data: counts,
                                    backgroundColor: [
                                        'rgba(139, 92, 246, 0.6)',
                                        'rgba(14, 165, 233, 0.6)',
                                        'rgba(245, 158, 11, 0.6)',
                                        'rgba(244, 63, 94, 0.6)',
                                        'rgba(16, 185, 129, 0.6)',
                                        'rgba(236, 72, 153, 0.6)',
                                        'rgba(100, 116, 139, 0.6)'
                                    ],
                                    borderColor: 'rgba(255, 255, 255, 0.1)',
                                    borderWidth: 1
                                }]
                            },
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: {
                                        position: 'bottom',
                                        labels: { color: '#94a3b8', font: { size: 10 } }
                                    }
                                }
                            }
                        });
                    }

                    const ctxWealth = document.getElementById('chart-wealth');
                    if (ctxWealth) {
                        if (wealthChart) wealthChart.destroy();
                        const labels = data.top_wealth.map(p => `${p.Name} (${p.UserID})`);
                        const values = data.top_wealth.map(p => p.Currency);

                        wealthChart = new Chart(ctxWealth, {
                            type: 'bar',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: '咔币持币量',
                                    data: values,
                                    backgroundColor: 'rgba(16, 185, 129, 0.5)',
                                    borderColor: 'rgba(16, 185, 129, 0.8)',
                                    borderWidth: 1,
                                    borderRadius: 6
                                }]
                            },
                            options: {
                                indexAxis: 'y',
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { display: false } },
                                scales: {
                                    x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8', font: { size: 9 } } },
                                    y: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 9 } } }
                                }
                            }
                        });
                    }

                    const ctxGrowth = document.getElementById('chart-growth');
                    if (ctxGrowth) {
                        if (growthChart) growthChart.destroy();
                        const labels = data.top_growth.map(p => p.Name);
                        const values = data.top_growth.map(p => p.Growth);

                        growthChart = new Chart(ctxGrowth, {
                            type: 'bar',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: '成长修为',
                                    data: values,
                                    backgroundColor: 'rgba(139, 92, 246, 0.5)',
                                    borderColor: 'rgba(139, 92, 246, 0.8)',
                                    borderWidth: 1,
                                    borderRadius: 6
                                }]
                            },
                            options: {
                                indexAxis: 'y',
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { display: false } },
                                scales: {
                                    x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8', font: { size: 9 } } },
                                    y: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 9 } } }
                                }
                            }
                        });
                    }
                };


                // 2. Pets Management
                const pets = reactive({
                    total: 0,
                    page: 1,
                    limit: 10,
                    data: []
                });
                const petsFilter = reactive({
                    user_id: '',
                    group_id: '',
                    name: '',
                    status: '',
                    pet_type: ''
                });

                const fetchPets = async () => {
                    try {
                        const params = new URLSearchParams({
                            page: pets.page.toString(),
                            limit: pets.limit.toString(),
                            user_id: petsFilter.user_id,
                            group_id: petsFilter.group_id,
                            name: petsFilter.name,
                            status: petsFilter.status,
                            pet_type: petsFilter.pet_type
                        });
                        const res = await fetch(`/api/admin/pets?${params}`);
                        const data = await res.json();
                        Object.assign(pets, data);
                    } catch (e) {
                        showToast('获取宠物列表失败: ' + e.message, 'error');
                    }
                };

                const clearPetsFilter = () => {
                    petsFilter.user_id = '';
                    petsFilter.group_id = '';
                    petsFilter.name = '';
                    petsFilter.status = '';
                    petsFilter.pet_type = '';
                    pets.page = 1;
                    fetchPets();
                };

                const prevPetsPage = () => {
                    if (pets.page > 1) {
                        pets.page--;
                        fetchPets();
                    }
                };

                const nextPetsPage = () => {
                    if (pets.page < Math.ceil(pets.total / pets.limit)) {
                        pets.page++;
                        fetchPets();
                    }
                };

                const getStatusBadgeClass = (status) => {
                    switch (status) {
                        case '空闲': return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                        case '学习': return 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30';
                        case '锻炼': return 'bg-sky-500/10 text-sky-400 border-sky-500/30';
                        case '打工': return 'bg-amber-500/10 text-amber-400 border-amber-500/30';
                        case '健身': return 'bg-purple-500/10 text-purple-400 border-purple-500/30';
                        case '濒死': return 'bg-rose-500/10 text-rose-400 border-rose-500/30 animate-pulse';
                        case '逃跑': return 'bg-yellow-500/10 text-yellow-400 border-yellow-500/30';
                        case '失去宠物': return 'bg-slate-500/10 text-slate-400 border-slate-500/30';
                        default: return 'bg-slate-500/10 text-slate-300 border-slate-500/30';
                    }
                };

                const operatePet = async (petId, action) => {
                    try {
                        const res = await fetch(`/api/admin/pets/${petId}/operate`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            showToast(data.message || '操作成功！');
                            fetchPets();
                            fetchStats();
                        } else {
                            showToast(data.error || '执行操作失败', 'error');
                        }
                    } catch (e) {
                        showToast('与服务器通信失败: ' + e.message, 'error');
                    }
                };

                const deletePet = async (petId) => {
                    if (confirm('警告！确定要永久删除这名玩家的宠物数据吗？删除后将无法找回！')) {
                        try {
                            const res = await fetch(`/api/admin/pets/${petId}`, { method: 'DELETE' });
                            const data = await res.json();
                            if (res.ok) {
                                showToast(data.message || '宠物删除成功');
                                fetchPets();
                                fetchStats();
                            } else {
                                showToast(data.error || '删除宠物失败', 'error');
                            }
                        } catch (e) {
                            showToast('请求异常: ' + e.message, 'error');
                        }
                    }
                };

                const editPetModal = reactive({
                    show: false,
                    data: {}
                });

                const openEditPet = (pet) => {
                    editPetModal.data = JSON.parse(JSON.stringify(pet));
                    editPetModal.show = true;
                };

                const savePetUpdate = async () => {
                    try {
                        const res = await fetch(`/api/admin/pets/${editPetModal.data.ID}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(editPetModal.data)
                        });
                        const data = await res.json();
                        if (res.ok) {
                            showToast('宠物属性修改保存成功');
                            editPetModal.show = false;
                            fetchPets();
                            fetchStats();
                        } else {
                            showToast(data.error || '修改保存失败', 'error');
                        }
                    } catch (e) {
                        showToast('保存异常: ' + e.message, 'error');
                    }
                };


                // 3. Group Control switches & compensations
                const groups = ref([]);
                const compensationForm = reactive({
                    group_id: 0,
                    user_ids: '',
                    coins: 0,
                    items: '',
                    notice: '【发放补偿】\n目标玩家：[奖励玩家]\n奖励内容：[奖励货币][奖励物品]'
                });

                const fetchGroups = async () => {
                    try {
                        const res = await fetch('/api/admin/groups');
                        groups.value = await res.json();
                    } catch (e) {
                        showToast('拉取群组列表失败: ' + e.message, 'error');
                    }
                };

                const updateGroupSwitch = async (g) => {
                    try {
                        const res = await fetch(`/api/admin/groups/${g.GroupID}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(g)
                        });
                        if (!res.ok) {
                            showToast('更新群开关失败', 'error');
                        }
                    } catch (e) {
                        showToast('群组设置同步失败: ' + e.message, 'error');
                    }
                };

                const deleteGroupSwitch = async (gid) => {
                    if (confirm('确定要删除这只群开关的记录吗？删除后将恢复为默认开启。')) {
                        try {
                            const res = await fetch(`/api/admin/groups/${gid}`, { method: 'DELETE' });
                            if (res.ok) {
                                showToast('删除群组记录成功');
                                fetchGroups();
                            }
                        } catch (e) {
                            showToast('操作异常: ' + e.message, 'error');
                        }
                    }
                };

                const syncGroups = async () => {
                    try {
                        const res = await fetch('/api/admin/groups/sync', { method: 'POST' });
                        const data = await res.json();
                        if (res.ok) {
                            showToast(data.message);
                            fetchGroups();
                        }
                    } catch (e) {
                        showToast('同步群组异常: ' + e.message, 'error');
                    }
                };

                const setAllGroupsState = async (state) => {
                    for (let g of groups.value) {
                        g.IsActive = state;
                        await updateGroupSwitch(g);
                    }
                    showToast(`已一键将所有群开关设置为: ${state ? '开启' : '关闭'}`);
                };

                const addQuickItemToCompensation = (name) => {
                    if (!name) return;
                    if (compensationForm.items) {
                        compensationForm.items += '#' + name + '*1';
                    } else {
                        compensationForm.items = name + '*1';
                    }
                };

                const insertVarToNotice = (variable) => {
                    compensationForm.notice += variable;
                };

                const getCompensationPreview = () => {
                    let text = compensationForm.notice;
                    let players = compensationForm.user_ids ? compensationForm.user_ids.replace(/#/g, ' @') : '本群全体宠物玩家';
                    if (compensationForm.user_ids) {
                        players = '@' + players;
                    }
                    
                    let coinName = configs.system_configs.find(c => c.Key === 'Core.CoinName')?.Value || '咔币';
                    let coins = compensationForm.coins > 0 ? `\n- ${compensationForm.coins} ${coinName}` : '';
                    let items = compensationForm.items ? `\n- ${compensationForm.items.replace(/#/g, '、')}` : '';

                        bodyData = sysConfigsToUpdate;

                    };
                    input.click();
                };

                const handleImageDrop = async (e, item, field) => {
                    const file = e.dataTransfer.files[0];
                    if (file && file.type.startsWith('image/')) {
                        await uploadFile(file, item, field);
                    }
                };

                const uploadFile = async (file, item, field) => {
                    const formData = new FormData();
                    formData.append('file', file);
                    try {
                        showToast('正在上传图片，请稍候...', 'info');
                        const res = await fetch('/api/admin/upload', {
                            method: 'POST',
                            body: formData
                        });
                        const data = await res.json();
                        if (res.ok) {
                            item[field] = data.path;
                            cacheBuster.value = Date.now(); // 强制刷新所有预览图的浏览器缓存
                            showToast('图片上传成功！已自动填充相对路径。');
                        } else {
                            showToast(data.error || '图片上传失败', 'error');
                        }
                    } catch (err) {
                        showToast('图片上传发生异常: ' + err.message, 'error');
                    }
                };

                // Helpers for Images
                const cacheBuster = ref(Date.now());

                const getPetImageURL = (relPath) => {
                    if (!relPath) return '';
                    const cleanPath = relPath.replace(/\\/g, '/');
                    return `/images/${cleanPath}?t=${cacheBuster.value}`;
                };

                const handleImageError = (e) => {
                    e.target.style.display = 'none';
                    const container = e.target.closest('.cursor-zoom-in') || e.target.parentElement;
                    if (container) {
                        container.style.display = 'none';
                    }
                };

                const lightbox = reactive({
                    show: false,
                    url: ''
                });

                const openImageLightbox = (path) => {
                    if (!path) return;
                    lightbox.url = getPetImageURL(path);
                    lightbox.show = true;
                };

                const knownItemNames = computed(() => {
                    return configs.item_configs.map(it => it.Name);
                });

                // Tab Switcher and Auto Loading
                watch(activeTab, (newTab) => {
                    if (!auth.authenticated) return;
                    if (newTab === 'dashboard') {
                        fetchStats();
                    } else if (newTab === 'pets') {
                        fetchPets();
                    } else if (newTab === 'groups') {
                        fetchGroups();
                    } else if (newTab === 'configs') {
                        fetchConfigs();
                    }
                });

                const loadAdminData = async () => {
                    await nextTick();
                    await Promise.all([
                        fetchStats(),
                        fetchPets(),
                        fetchGroups(),
                        fetchConfigs()
                    ]);
                };

                onMounted(() => {
                    checkAdminSession();
                });

                return {
                    auth,
                    loginForm,
                    login,
                    logout,
                    changePasswordModal,
                    openChangePassword,
                    changePassword,
                    activeTab,
                    loading,
                    toast,
                    showToast,
                    
                    // Stats
                    stats,
                    
                    // Pets
                    pets,
                    petsFilter,
                    fetchPets,
                    clearPetsFilter,
                    prevPetsPage,
                    nextPetsPage,
                    getStatusBadgeClass,
                    operatePet,
                    deletePet,
                    editPetModal,
                    openEditPet,
                    savePetUpdate,
                    getPetImageURL,
                    handleImageError,

                    // Groups & Compensation
                    groups,
                    compensationForm,
                    fetchGroups,
                    updateGroupSwitch,
                    deleteGroupSwitch,
                    syncGroups,
                    setAllGroupsState,
                    addQuickItemToCompensation,
                    insertVarToNotice,
                    getCompensationPreview,
                    sendCompensation,

                    // Configs CRUD Workspace
                    configTabs,
                    activeConfigTab,
                    sysConfigSearch,
                    configs,
                    currencyConfig,
                    weeklyCheckinDays,
                    selectedCheckin,
                    selectedConfigItem,
                    addConfigModal,
                    changeConfigTab,
                    selectCheckinReward,
                    getWeeklyDayName,
                    addQuickItemToCheckin,
                    insertVarToMenu,
                    getNormalShopItems,
                    getAffectionShopItems,
                    filteredSystemConfigs,
                    getSystemConfigDesc,
                    getConfigTabTitle,
                    isConfigItemCrudable,
                    openAddConfigModal,
                    submitAddConfigItem,
                    deleteConfigItem,
                    saveActiveConfig,
                    reloadConfigs,
                    confirmReset,
                    knownItemNames,
                    triggerImageUpload,
                    handleImageDrop,
                    lightbox,
                    openImageLightbox
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
